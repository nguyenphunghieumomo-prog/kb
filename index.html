<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ tay học tập</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{--bg:#050505;--panel:#111;--panel2:#181818;--line:#2a2a2a;--tx:#f5f5f5;--mu:#b8b8b8;--ac:#e50914;--ach:#ff1e1e;--ok:#34d399;--wa:#fbbf24;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=light]{--bg:#fafafa;--panel:#fff;--panel2:#f3f3f3;--line:#e2e2e2;--tx:#111;--mu:#555;--ac:#d10812;--ach:#e50914}
*{box-sizing:border-box}html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Times New Roman",Times,serif;position:relative}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(229,9,20,.28),transparent 70%),radial-gradient(circle at 90% 60%,rgba(229,9,20,.08),transparent 55%),linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.035) 1px,transparent 1px);background-size:auto,auto,4rem 4rem,4rem 4rem;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}
:root[data-theme=light] body:before{opacity:.35}
a{color:var(--ac);text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:var(--tx);cursor:pointer}
.logo b{width:34px;height:34px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 14px Arial;box-shadow:0 0 18px rgba(229,9,20,.45)}
.logo span{line-height:1.15;font-weight:700}.logo small{display:block;font-weight:400;color:var(--mu);font-size:12px}
nav{display:flex;gap:4px}nav a{padding:7px 14px;border-radius:8px;color:var(--tx);font-size:15px}
nav a.on,nav a:hover{background:var(--panel2)}
.sp{flex:1}
.sb{display:flex;align-items:center;gap:8px;min-width:240px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--mu);cursor:pointer;font-size:14px}
.sb kbd{margin-left:auto;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--tx);cursor:pointer;font-size:16px}
main{max-width:1180px;margin:auto;padding:34px 20px 70px}
h2.t{font-size:26px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2.t:after{content:"";display:none}.ul{width:38px;height:3px;background:var(--ac);border-radius:3px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:rgba(229,9,20,.55);box-shadow:0 0 24px rgba(229,9,20,.12)}
.ch{display:flex;gap:12px;align-items:center;cursor:pointer}
.ic{width:42px;height:42px;border-radius:10px;background:var(--panel2);color:var(--ac);display:grid;place-items:center;font:700 13px Arial;flex:none}
.ch h3{margin:0;font-size:18px;line-height:1.2}.ch p{margin:0;color:var(--mu);font-size:14px}
.cnt{margin-left:auto;border:1px solid var(--line);border-radius:20px;padding:0 9px;font:12px Arial;color:var(--mu)}
.li{border-top:1px solid var(--line);padding:8px 0;font-size:15px;cursor:pointer}.li:hover{color:var(--ac)}
.em{border-top:1px dashed var(--line);padding:10px 0 2px;color:var(--mu);font-size:14px;font-style:italic}
.more{font:600 13px Arial;cursor:pointer;color:var(--ac)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:5px 13px;border:1px solid var(--line);border-radius:20px;background:var(--panel);cursor:pointer;font-size:14px;color:var(--tx)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 0 14px rgba(229,9,20,.35)}.chip:hover{border-color:var(--ac)}
.subs{display:flex;gap:6px;flex-wrap:wrap}.subs span{font:12px Arial;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:1px 8px;cursor:pointer}.subs span:hover{color:#fff;background:var(--ac);border-color:var(--ac)}
.gh{font-size:19px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}.gh:before{content:"";width:4px;height:18px;background:var(--ac);border-radius:2px}.gh small{font:12px Arial;color:var(--mu)}
.note{margin-top:8px;padding:8px 12px;border-left:3px solid var(--wa);background:var(--panel2);font-size:14px;color:var(--mu)}
.bc{font:13px Arial;color:var(--mu);margin-bottom:12px}.bc a{cursor:pointer}
.gd h3{margin:26px 0 6px;font-size:19px}.gd ol,.gd ul{margin:6px 0;padding-left:22px}.gd pre{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:10px;overflow:auto;font:13px Consolas,monospace}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;cursor:pointer}
.row:hover{border-color:var(--ac)}.row h4{margin:0 0 4px;font-size:18px}.row p{margin:0;color:var(--mu);font-size:15px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font:12px Arial;color:var(--mu)}
.bd{padding:1px 8px;border-radius:20px;border:1px solid var(--line)}
.bd.ok{color:var(--ok);border-color:var(--ok)}.bd.wa{color:var(--wa);border-color:var(--wa)}
.post{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:36px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 30px 30px;min-width:0}
.md h1{font-size:30px;margin:20px 0 4px}.md h2{font-size:22px;margin:30px 0 8px;padding-top:6px;border-top:1px solid var(--line)}
.md img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;margin:12px 0 4px}
.md blockquote{margin:16px 0;padding:6px 16px;border-left:3px solid var(--ac);color:var(--mu);background:var(--panel2)}
.md code{font:14px Consolas,monospace;background:var(--panel2);padding:1px 6px;border-radius:5px}
.md pre{background:var(--panel2);padding:14px;border-radius:10px;overflow:auto}.md pre code{padding:0;background:none}
.tw{overflow-x:auto}.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap}.md th{background:var(--panel2)}
.toc{position:sticky;top:90px;align-self:start;font-size:14px;border-left:2px solid var(--line);padding-left:14px}
.toc b{display:block;margin-bottom:6px;font:600 12px Arial;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.toc a{display:block;color:var(--mu);padding:3px 0}.toc a:hover{color:var(--ac)}
.back{display:inline-block;margin-bottom:14px;font:14px Arial;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;padding:12vh 16px 0}
#ov.on{display:block}
.mod{max-width:600px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mod input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--tx);padding:15px 18px;font:16px "Times New Roman",serif;outline:0}
.res{max-height:50vh;overflow:auto}.res div{padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer}.res div:hover{background:var(--panel2)}
.res small{display:block;color:var(--mu);font:12px Arial}
footer{text-align:center;color:var(--mu);font:13px Arial;padding:24px}
@media(max-width:860px){.post{grid-template-columns:1fr}.toc{display:none}.md{padding:6px 16px 20px}.sb{min-width:0;flex:1}}
</style>
</head>
<body>
<header><div class="bar">
 <div class="logo" onclick="go('')"><b id="lg">KB</b><span id="st">Sổ tay học tập<small id="ss"></small></span></div>
 <nav><a href="#" data-n="home">Trang chủ</a><a href="#posts" data-n="posts">Bài viết</a><a href="#drafts" data-n="drafts">Chờ duyệt</a><a href="#guide" data-n="guide">Đẩy tài liệu</a></nav>
 <div class="sp"></div>
 <div class="sb" onclick="openS()">🔍 Tìm bài, lệnh, từ khóa… <kbd>Ctrl K</kbd></div>
 <button class="ib" id="th" title="Sáng/Tối">☾</button>
</div></header>
<main id="app"></main>
<footer>Nội dung lưu trên GitHub · tự động cập nhật qua quy trình duyệt</footer>
<div id="ov"><div class="mod"><input id="q" placeholder="Nhập từ khóa…"><div class="res" id="rs"></div></div></div>
<script>
const $=s=>document.querySelector(s);let D,CACHE={};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function txt(p){if(CACHE[p]!=null)return CACHE[p];
 if(window.__KB__&&window.__KB__.files[p]!=null)return CACHE[p]=window.__KB__.files[p];
 return CACHE[p]=await (await fetch(p)).text()}
const cat=id=>D.categories.find(c=>c.id==id);
const ok=p=>p.status=='approved';
const sub=(p)=>((cat(p.cat).subs||[]).find(s=>s.id==p.sub)||{name:p.sub}).name;
const pst=p=>`<div class="row" onclick="go('post/${p.id}')"><h4>${esc(p.title)}</h4><p>${esc(p.summary||'')}</p><div class="meta"><span class="bd">${esc(cat(p.cat).name)} › ${esc(sub(p))}</span><span class="bd">${esc(p.type)}</span><span class="bd ${ok(p)?'ok':'wa'}">${ok(p)?'Đã duyệt':'Bản nháp'}</span><span>Cập nhật ${p.updated}</span></div>${p.review_note?`<div class="note">Cần chỉnh: ${esc(p.review_note)}</div>`:''}</div>`;
function go(h){location.hash=h}
function nav(n){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.n==n))}
function home(){nav('home');const cs=D.categories.map(c=>{const ps=D.posts.filter(p=>p.cat==c.id&&ok(p));
 const l=ps.slice(0,3).map(p=>`<div class="li" onclick="go('post/${p.id}')">${esc(p.title)}</div>`).join('')||'<div class="em">Chưa có bài trong mục này</div>';
 const sb=(c.subs||[]).map(s=>`<span onclick="go('cat/${c.id}/${s.id}')">${esc(s.name)}</span>`).join('');
 return `<div class="card"><div class="ch" onclick="go('cat/${c.id}')"><div class="ic">${c.ic}</div><div><h3>${c.name}</h3><p>${c.desc}</p></div><span class="cnt">${ps.length}</span></div><div class="subs">${sb}</div>${l}<a class="more" href="#cat/${c.id}">Xem tất cả ›</a></div>`}).join('');
 $('#app').innerHTML=`<h2 class="t">Bạn đang học gì?<a class="more" href="#posts">Tất cả bài viết ›</a></h2><div class="ul"></div><div class="grid">${cs}</div>`}
function list(c,draft,s){nav(draft?'drafts':'posts');let ps=D.posts.filter(p=>draft?!ok(p):ok(p));if(c)ps=ps.filter(p=>p.cat==c);if(s)ps=ps.filter(p=>p.sub==s);
 let ch='',body;
 if(!draft){ch=`<div class="chips"><span class="chip ${!c?'on':''}" onclick="go('posts')">Tất cả</span>${D.categories.map(x=>`<span class="chip ${c==x.id?'on':''}" onclick="go('cat/${x.id}')">${x.name}</span>`).join('')}</div>`;
  if(c)ch+=`<div class="chips"><span class="chip ${!s?'on':''}" onclick="go('cat/${c}')">Mọi mục nhỏ</span>${cat(c).subs.map(x=>`<span class="chip ${s==x.id?'on':''}" onclick="go('cat/${c}/${x.id}')">${esc(x.name)}</span>`).join('')}</div>`}
 if(c&&!s&&!draft){body=cat(c).subs.map(x=>{const g=ps.filter(p=>p.sub==x.id);return `<h3 class="gh">${esc(x.name)} <small>${g.length} bài</small></h3>${g.map(pst).join('')||'<p style="color:var(--mu);font-style:italic;margin:0">Chưa có bài</p>'}`}).join('')}
 else body=ps.map(pst).join('')||'<p style="color:var(--mu)">Chưa có bài nào.</p>';
 $('#app').innerHTML=`<h2 class="t">${draft?'Bài chờ duyệt':c?cat(c).name+(s?' › '+esc((cat(c).subs.find(x=>x.id==s)||{}).name||s):''):'Tất cả bài viết'}</h2><div class="ul"></div>${ch}${body}`}
function guide(){nav('guide');$('#app').innerHTML=`<h2 class="t">Đẩy tài liệu lên web</h2><div class="ul"></div><div class="md gd" style="padding:6px 30px 26px">
<h3>Quy trình</h3><ol><li>Bỏ file gốc (docx, xlsx, pdf, ảnh…) vào thư mục <code>inbox/</code> trong repo, bằng Visual Studio hoặc git.</li><li>Chạy <code>python scripts/convert_inbox.py</code> để chuyển sang văn bản + ảnh.</li><li>Mở Copilot Chat (chế độ Agent), gõ: <code>Xử lý inbox</code>. Copilot đọc luật trong <code>.github/copilot-instructions.md</code>, phân loại vào mục → mục nhỏ, soạn bài <b>bản nháp</b>.</li><li>Bài mới hiện ở tab <b>Chờ duyệt</b> (xem thử bằng <code>python -m http.server</code>). Gõ yêu cầu chỉnh sửa cho Copilot, hoặc ghi vào <code>review_note</code>.</li><li>Ưng ý thì gõ <code>Duyệt bài &lt;tên&gt;</code>: Copilot đổi <code>status: approved</code>.</li><li><code>git push</code> lên nhánh main, GitHub Actions tự dựng lại và đăng lên GitHub Pages.</li></ol>
<h3>Cấu trúc thư mục</h3><pre>docs/&lt;mục&gt;/&lt;mục-nhỏ&gt;/&lt;tên-bài&gt;.md
assets/img/&lt;mục&gt;/&lt;tên-bài&gt;/*.png
inbox/        tài liệu gốc chờ xử lý
archive/      tài liệu gốc đã xử lý
data/categories.json   khai báo mục + mục nhỏ</pre>
<h3>Thêm mục mới / mục nhỏ mới</h3><ul><li><b>Mục nhỏ:</b> chỉ cần Copilot tạo thư mục <code>docs/&lt;mục&gt;/&lt;mục-nhỏ-mới&gt;/</code> và đặt bài vào, web tự nhận.</li><li><b>Mục lớn:</b> thêm một khối vào <code>data/categories.json</code> (id, name, desc, ic) hoặc cứ tạo thư mục <code>docs/&lt;mục-mới&gt;/…</code> rồi chạy <code>python scripts/build_index.py</code>.</li><li>Khi tài liệu không khớp mục nào, Copilot phải hỏi bạn trước khi tạo mục mới.</li></ul></div>`}
async function post(id){const p=D.posts.find(x=>x.id==id);if(!p)return list();nav(ok(p)?'posts':'drafts');
 let m=(await txt(p.path)).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');const base=p.path.replace(/[^/]+$/,'');
 const html=marked.parse(m).replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>');
 $('#app').innerHTML=`<div class="bc"><a onclick="go('')">Trang chủ</a> › <a onclick="go('cat/${p.cat}')">${esc(cat(p.cat).name)}</a> › <a onclick="go('cat/${p.cat}/${p.sub}')">${esc(sub(p))}</a></div><div class="post"><article class="md" id="md">${html}<div class="meta" style="margin-top:22px"><span class="bd">${esc(cat(p.cat).name)} › ${esc(sub(p))}</span><span class="bd ${ok(p)?'ok':'wa'}">${ok(p)?'Đã duyệt':'Bản nháp'}</span>${p.tags.map(t=>`<span class="bd">#${esc(t)}</span>`).join('')}</div></article><aside class="toc" id="toc"><b>Trong bài</b></aside></div>`;
 document.querySelectorAll('#md h2').forEach((h,i)=>{h.id='s'+i;$('#toc').insertAdjacentHTML('beforeend',`<a href="javascript:document.getElementById('s${i}').scrollIntoView({behavior:'smooth'})">${h.textContent}</a>`)});scrollTo(0,0)}
function route(){const h=location.hash.slice(1),[a,b]=h.split('/');
 if(a=='post')post(b);else if(a=='cat')list(b,0,h.split('/')[2]);else if(a=='guide')guide();else if(a=='posts')list();else if(a=='drafts')list(null,1);else home()}
function openS(){$('#ov').classList.add('on');$('#q').value='';$('#q').focus();find('')}
async function find(q){q=q.toLowerCase().trim();let out=[];
 for(const p of D.posts){const t=(p.title+' '+p.tags.join(' ')+' '+(p.summary||'')).toLowerCase();let body=q.length>1?(await txt(p.path)).toLowerCase():'';
  if(!q||t.includes(q)||body.includes(q))out.push(p)}
 $('#rs').innerHTML=out.map(p=>`<div onclick="$('#ov').classList.remove('on');go('post/${p.id}')">${esc(p.title)}<small>${esc(cat(p.cat).name)} › ${esc(sub(p))} · ${esc(p.type)}</small></div>`).join('')||'<div>Không có kết quả</div>'}
$('#q').oninput=e=>find(e.target.value);
$('#ov').onclick=e=>{if(e.target.id=='ov')$('#ov').classList.remove('on')};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();openS()}if(e.key=='Escape')$('#ov').classList.remove('on')});
$('#th').onclick=()=>{const r=document.documentElement,l=r.dataset.theme=='dark';r.dataset.theme=l?'light':'dark';$('#th').textContent=l?'☀':'☾'};
addEventListener('hashchange',route);
(async()=>{D=window.__KB__?window.__KB__.index:JSON.parse(await txt('data/index.json'));$('#ss').textContent=D.site.sub;route()})();
</script>
</body></html>
